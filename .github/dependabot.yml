version: 2

updates:
  # Modules Go (go.mod / go.sum).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(go)"
    groups:
      # Mineures et correctifs regroupés en une seule PR ; les majeures restent séparées.
      go-minor-patch:
        update-types: [minor, patch]

  # Actions utilisées par les workflows (.github/workflows).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]

  # Images de base du Dockerfile (golang, distroless).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    commit-message:
      prefix: "deps(docker)"
