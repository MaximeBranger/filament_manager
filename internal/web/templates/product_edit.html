{{define "content"}}
<h1>Produit</h1>
<form method="post" action="/products/{{.Product.ID}}" class="card">
  {{if .Product.SpoolCount}}<p class="notice">Les modifications s'appliquent à {{.Product.SpoolCount}} {{plural .Product.SpoolCount "bobine" "bobines"}}.</p>{{end}}
  {{template "datalists" .}}
  {{template "product_fields" .}}
  <div class="actions"><a class="btn" href="/products">Annuler</a><button class="btn primary">Enregistrer</button></div>
</form>
{{if eq .Product.SpoolCount 0}}
<form method="post" action="/products/{{.Product.ID}}/delete" class="danger-zone" data-confirm="Supprimer ce produit ?">
  <button class="btn danger">Supprimer le produit</button>
</form>
{{end}}
{{end}}
