{{define "content"}}
<div class="narrow">
  <h1>Connexion</h1>
  <p class="muted">Pas de mot de passe : saisissez votre email, vous recevrez un lien et un code de connexion. Si vous n'avez pas encore de compte, il sera créé.</p>
  <form method="post" action="/login" class="card" id="login-form">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Adresse email
      <input type="email" name="email" value="{{.Email}}" required autocomplete="email webauthn" autofocus>
      {{with .Error}}<span class="field-error">{{.}}</span>{{end}}
    </label>
    <button class="btn primary">Recevoir mon lien</button>
  </form>
  <div class="passkey-login" id="passkey-login-wrap" hidden>
    <p class="muted small">ou</p>
    <button type="button" class="btn" id="passkey-login">Se connecter avec une passkey</button>
    <p id="passkey-status" class="field-error" role="alert"></p>
  </div>
</div>
{{end}}

{{define "scripts"}}<script src="/static/passkeys.js?v={{.Version}}"></script>{{end}}
