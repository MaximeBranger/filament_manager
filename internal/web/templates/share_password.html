{{define "content"}}
<div class="narrow">
  <h1>Partage protégé</h1>
  <div class="card">
    {{if .Locked}}
      <p>Ce partage est momentanément indisponible. Contactez la personne qui vous l'a envoyé.</p>
    {{else}}
      <p>Ce partage est protégé par un mot de passe.</p>
      <form method="post" action="/share/{{.Token}}/unlock">
        <label>Mot de passe
          <input type="password" name="password" required autocomplete="current-password" autofocus>
          {{with .Error}}<span class="field-error">{{.}}</span>{{end}}
        </label>
        <button class="btn primary">Ouvrir</button>
      </form>
    {{end}}
  </div>
</div>
{{end}}
